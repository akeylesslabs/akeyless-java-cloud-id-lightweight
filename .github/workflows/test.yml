name: "Tests"

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  java-test:
    name: Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The project targets Java 17 (maven.compiler.target=17, JUnit Jupiter 6),
      # so the toolchain must be JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: mvn -B -Drevision=1.0.0-SNAPSHOT test
